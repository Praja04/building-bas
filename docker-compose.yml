services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: building-bas-app:latest
    container_name: building-bas-app
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    ports:
      - "8094:80"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: building-bas-app:latest
    container_name: building-bas-worker
    restart: unless-stopped
    command: |
      sh -c 'trap "kill 0" SIGTERM SIGINT EXIT; \
        php artisan queue:work database --tries=3 --timeout=90 --sleep=1 & \
        wait'
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - mysql

  mysql:
    image: mysql:8.0
    container_name: building-bas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: idcard
    volumes:
      - building-bas-db-data:/var/lib/mysql
    ports:
      - "3308:3306"

volumes:
  building-bas-db-data:
